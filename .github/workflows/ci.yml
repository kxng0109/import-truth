name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }}, java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [21, 25]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Make wrapper executable
        run: chmod +x mvnw
      - name: Verify
        # install (not just verify): lookup tests spawn nested Maven runs
        # that resolve sibling snapshots from the repository.
        run: ./mvnw -B -ntp clean install
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.java == '25'
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
        with:
          use_oidc: true
          files: '**/target/site/jacoco/jacoco.xml'
          fail_ci_if_error: false
