# GraalVM native-image build settings for the importtruth CLI.
#
# native-image reads this file automatically from any classpath entry that
# contains it, so a direct "native-image" call and the Maven "native"
# profile build the same image.
#
# Args entries are whitespace separated.
#   -O2                              optimise for running speed
#   --no-fallback                    never build a fallback image that needs a JVM
#   -H:+ReportExceptionStackTraces   print stack traces of exceptions seen while
#                                    the image is built
Args = -O2 --no-fallback -H:+ReportExceptionStackTraces
#
# Name of the produced executable. A -o on the command line overrides it.
ImageName = importtruth
