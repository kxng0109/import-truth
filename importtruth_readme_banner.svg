<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>importtruth banner</title>
<desc>Three stages left to right: a stack of JAR files is resolved, indexed into a card catalog drawer filed by fingerprint, then used to check imports where a real import gets a check mark and a misspelled one gets a correction.</desc>
<style>
.h{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:500;fill:#e8f1f2}
.sub{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;fill:#8fb4bd}
.lab{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;fill:#9bc4cb}
.jar{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#07242b}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="240" rx="12" fill="#0f1f2a"/>
<text class="h" x="40" y="44">importtruth</text>
<text class="sub" x="640" y="44" text-anchor="end">does this name exist?</text>
<line x1="40" y1="60" x2="640" y2="60" stroke="#1f3a47" stroke-width="1"/>

<rect x="48" y="168" width="112" height="26" rx="4" fill="#54b3b8"/>
<text class="jar" x="60" y="185">guava.jar</text>
<rect x="56" y="136" width="112" height="26" rx="4" fill="#3b97a0"/>
<text class="jar" x="68" y="153">jackson.jar</text>
<rect x="48" y="104" width="112" height="26" rx="4" fill="#2f7f86"/>
<text class="jar" x="60" y="121" style="fill:#d9f0f2">spring-core.jar</text>
<text class="lab" x="108" y="218" text-anchor="middle">1 resolve</text>

<line x1="176" y1="148" x2="198" y2="148" stroke="#5f8a94" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="214" y="88" width="38" height="50" rx="3" fill="#f2e8cf"/>
<line x1="221" y1="100" x2="245" y2="100" stroke="#b9ad8e" stroke-width="1.5"/>
<line x1="221" y1="108" x2="240" y2="108" stroke="#b9ad8e" stroke-width="1.5"/>
<rect x="258" y="82" width="38" height="56" rx="3" fill="#ebdfc0"/>
<line x1="265" y1="94" x2="289" y2="94" stroke="#b9ad8e" stroke-width="1.5"/>
<line x1="265" y1="102" x2="284" y2="102" stroke="#b9ad8e" stroke-width="1.5"/>
<rect x="302" y="90" width="38" height="48" rx="3" fill="#f2e8cf"/>
<line x1="309" y1="102" x2="333" y2="102" stroke="#b9ad8e" stroke-width="1.5"/>
<rect x="206" y="124" width="140" height="72" rx="6" fill="#24485a" stroke="#3b97a0" stroke-width="1"/>
<rect x="240" y="142" width="72" height="20" rx="3" fill="#f2e8cf"/>
<text class="code" x="276" y="156" text-anchor="middle" style="fill:#2b2b2b;font-size:11px">a3f9...c1</text>
<rect x="262" y="174" width="28" height="6" rx="3" fill="#3b97a0"/>
<text class="lab" x="276" y="218" text-anchor="middle">2 index by fingerprint</text>

<line x1="356" y1="148" x2="378" y2="148" stroke="#5f8a94" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="388" y="84" width="252" height="112" rx="6" fill="#0a161d" stroke="#1f3a47" stroke-width="1"/>
<text class="code" x="402" y="109" style="fill:#cfe3e6">import com.acme.Widget;</text>
<path d="M606 104 L612 110 L622 98" fill="none" stroke="#4cc38a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="394" y="120" width="240" height="24" rx="4" fill="#3a1f22"/>
<text class="code" x="402" y="136" style="fill:#f08a7a">import com.acme.Widgit;</text>
<path d="M608 126 L620 138 M620 126 L608 138" fill="none" stroke="#f08a7a" stroke-width="2.5" stroke-linecap="round"/>
<rect x="394" y="152" width="240" height="32" rx="4" fill="#173a2c"/>
<text class="code" x="402" y="172" style="fill:#8fe0b5">did you mean Widget?</text>
<text class="lab" x="514" y="218" text-anchor="middle">3 answer</text>
